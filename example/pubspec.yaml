name: firebench_example
description: Example app demonstrating per-screen performance tracing with firebench.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.10.0
  firebase_performance: ^0.11.4
  firebench:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
