name: firebench
description: Sentry-style automatic per-screen performance tracing for Flutter, reported to the free Firebase Performance backend.
version: 0.1.0-alpha.2
repository: https://github.com/dipendra-sharma/firebench
issue_tracker: https://github.com/dipendra-sharma/firebench/issues
topics:
  - firebase
  - performance
  - monitoring
  - tracing
  - observability

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_performance: ^0.11.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
